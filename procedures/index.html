<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Camp Instructions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{color-scheme:light;--bg:#eef0ec;--ink:#1f2a28;--muted:#5b6862;--line:#c9cfc9;--panel:#f7f8f5;--ember:#d4531c;--chip:#e3e7e2;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#151a19;--ink:#dce3df;--muted:#97a39d;--line:#2d3634;--panel:#1c2221;--ember:#ec6a32;--chip:#26302e;}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#151a19;--ink:#dce3df;--muted:#97a39d;--line:#2d3634;--panel:#1c2221;--ember:#ec6a32;--chip:#26302e;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "IBM Plex Sans",system-ui,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:28px 16px 48px}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.01em;text-wrap:balance;margin:0}
h1{font-size:2.2rem;font-weight:700;line-height:1.05}
h2{font-size:1.35rem;font-weight:600;margin:28px 0 8px;padding-top:10px;border-top:1px solid var(--line)}
h3{font-size:1.1rem;font-weight:600;margin:14px 0 4px}
p{margin:8px 0}
ul,ol{margin:6px 0;padding-left:22px}
li{margin:4px 0}
a{color:var(--ember)}
code,.id{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.85em}
.sub{color:var(--muted);max-width:68ch}
.chip{display:inline-block;background:var(--chip);border-radius:3px;padding:1px 8px;font:600 .75rem "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);vertical-align:middle}
.head{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:baseline;margin-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:10px}
.box{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:10px 14px}
.box h3{margin-top:0}
.box ul{padding-left:18px}
.src{color:var(--muted);font-size:.85rem}
ol.steps>li{padding-left:4px}
.call{font-weight:600}
.call::before{content:"▸ ";color:var(--ember)}
.note{color:var(--muted);font-weight:400}
.tree{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.82rem;line-height:1.5;background:var(--panel);border:1px solid var(--line);padding:10px 14px;overflow-x:auto;white-space:pre}
.list .group{margin-top:18px}
.list li{margin:2px 0}
.err{border-left:4px solid var(--ember);background:var(--panel);padding:10px 14px;white-space:pre-wrap}
.safety li::marker{color:var(--ember)}
</style>
</head>
<body>
<script src="../nav.js"></script>
<div class="wrap" id="app"><p class="sub">Loading the instructions…</p></div>
<script src="../simulator/model.js"></script>
<script src="../shelter/layout.js"></script>
<script src="params.js"></script>
<script src="catalog.stove.js"></script>
<script src="catalog.shelter.js"></script>
<script src="catalog.food.js"></script>
<script src="catalog.js"></script>
<script src="lib.js"></script>
<script src="schedule.js"></script>
<script src="index.js"></script>
<script>
(function () {
  'use strict';
  const app = document.getElementById('app');
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const KIND_NAMES = { plan: 'Plan', task: 'Task', make: 'Make a tool', gather: 'Gather', skill: 'Skill' };

  function loadAll() {
    return Promise.all(window.PROCEDURE_IDS.map((id) => new Promise((ok, fail) => {
      const s = document.createElement('script');
      s.src = `${id}.js`;
      s.onload = ok;
      s.onerror = () => fail(new Error(`procedures/${id}.js did not load`));
      document.body.appendChild(s);
    })));
  }

  loadAll().then(() => {
    const L = window.ProcLib, C = window.Catalog;
    const reg = L.byId(window.PROCEDURES);
    const params = window.ProcParams.build(window.ShelterLayout, window.StoveModel);
    const T = (t) => esc(L.render(t, params));
    const problems = [...reg.values()].flatMap((p) => L.validate(p, reg, C)).concat(L.validateCatalog(reg, C));
    const link = (id) => reg.get(id) ? `<a href="#${esc(id)}">${esc(reg.get(id).title)}</a>` : `<code>${esc(id)}</code>`;
    const toolName = (t) => {
      const x = C.TOOLS[t];
      if (!x) return esc(t);
      return x.source === 'kit' ? `${T(x.name)} <span class="src">(kit)</span>` : `${T(x.name)} <span class="src">(made: ${link(x.source)})</span>`;
    };
    const matName = (m, withQty = true) => {
      const x = C.MATERIALS[m.id];
      const q = withQty ? `${+m.qty.toFixed(2)}${x.unit === 'count' ? ' ×' : ' ' + esc(x.unit)} ` : '';
      const src = x.source === 'site' ? 'on the site' : link(x.source);
      return `${q}${T(x.name.charAt(0).toLowerCase() + x.name.slice(1))} <span class="src">(${src})</span>`;
    };
    const ul = (items, empty = 'None') => items.length ? `<ul>${items.map((i) => `<li>${i}</li>`).join('')}</ul>` : `<p class="src">${empty}</p>`;

    function treeText(id) {
      return L.trace(id, reg).filter((e) => e.type === 'enter')
        .map((e) => `${'   '.repeat(e.depth)}${e.depth ? '└─ ' : ''}${reg.get(e.id).title}`).join('\n');
    }

    function renderList() {
      document.title = 'Camp Instructions';
      const groups = ['plan', 'task', 'make', 'gather', 'skill'];
      app.innerHTML = `
        <h1>Instructions</h1>
        <p><a href="#schedule">Season schedule</a> · <a href="#plan.season">The season plan</a></p>
        <p class="sub">Every job in the camp, written like code. Each one lists the tools, materials and skills it needs, and calls other instructions as steps, the way a function calls functions. Only the ten kit items are assumed; everything else is made or gathered by an instruction here. Start from a plan.</p>
        ${problems.length ? `<div class="err">Problems in the instructions:\n${esc(problems.join('\n'))}</div>` : ''}
        <div class="list">${groups.map((k) => {
          const ps = [...reg.values()].filter((p) => p.kind === k);
          return ps.length ? `<div class="group"><h2>${KIND_NAMES[k]}${k === 'skill' ? 's' : k === 'plan' ? 's' : ''}</h2><ul>${ps.map((p) => `<li>${link(p.id)} <span class="src">— ${T(p.purpose)}</span></li>`).join('')}</ul></div>` : '';
        }).join('')}</div>
        <h2>The kit</h2>
        <p class="sub">The only things carried in. Every other tool is made on site.</p>
        ${ul(C.KIT.map((t) => T(C.TOOLS[t].name)))}`;
    }

    function renderOne(p) {
      document.title = p.title;
      const n = L.needs(p.id, reg, C);
      const by = L.usedBy(p.id, reg);
      const total = L.hours(p.id, reg, C);
      const r = p.requires;
      const steps = p.steps.map((s) => L.isCall(s)
        ? `<li><span class="call">${link(s.call)}</span>${s.times > 1 ? ` <span class="note">× ${s.times}</span>` : ''}${s.note ? ` <span class="note">— ${T(s.note)}</span>` : ''}</li>`
        : `<li>${T(s)}</li>`).join('');
      const hasCalls = p.steps.some(L.isCall);
      app.innerHTML = `
        <p><a href="#">All instructions</a></p>
        <div class="head"><span class="chip">${KIND_NAMES[p.kind]}</span><span class="id">${esc(p.id)}</span></div>
        <h1>${T(p.title)}</h1>
        <p class="sub">${T(p.purpose)}</p>
        ${by.length ? `<p class="src">Called by: ${by.map(link).join(', ')}</p>` : ''}

        <h2>Needs for this instruction</h2>
        <div class="grid">
          <div class="box"><h3>Tools</h3>${ul(r.tools.map(toolName), 'Bare hands')}</div>
          <div class="box"><h3>Materials</h3>${ul(r.materials.map((m) => matName(m)))}</div>
          <div class="box"><h3>Skills</h3>${ul(r.skills.map(link))}</div>
        </div>
        ${p.produces.tools.length || p.produces.materials.length ? `<h3>Produces</h3>${ul([...p.produces.tools.map(toolName), ...p.produces.materials.map((m) => matName(m))])}` : ''}

        ${hasCalls ? `
        <h2>Everything needed, including what it calls</h2>
        <div class="grid">
          <div class="box"><h3>Carried in</h3>${ul(n.carried.map(toolName), 'Nothing from the kit')}</div>
          <div class="box"><h3>Must already be made</h3>${ul(n.toMake.map(toolName))}</div>
          <div class="box"><h3>Made along the way</h3>${ul(n.made.map(toolName))}</div>
          <div class="box"><h3>Skills</h3>${ul(n.skills.map(link))}</div>
          <div class="box"><h3>Taken from the site</h3>${ul(n.inputs.map((m) => matName(m)), 'Nothing beyond what it gathers')}</div>
        </div>` : ''}

        ${p.preconditions.length ? `<h2>Before you start</h2>${ul(p.preconditions.map(T))}` : ''}
        <h2>Steps</h2>
        <ol class="steps">${steps}</ol>
        ${p.checks.length ? `<h2>Done when</h2>${ul(p.checks.map(T))}` : ''}
        ${p.safety.length ? `<h2>Safety</h2><ul class="safety">${p.safety.map((s) => `<li>${T(s)}</li>`).join('')}</ul>` : ''}
        <h2>Time</h2>
        <p>About ${+p.estimate.hours.toFixed(1)} hours for this instruction's own steps${hasCalls ? `, about ${+total.toFixed(1)} hours including everything it calls` : ''}.${p.estimate.note ? ` ${T(p.estimate.note)}` : ''}${p.estimate.waitDays ? ` Then wait about ${p.estimate.waitDays} days before what follows can use it.` : ''}${p.repeat === 'daily' ? ' Done every day.' : ''} These are estimates.</p>
        ${hasCalls ? `<h2>Call tree</h2><div class="tree">${esc(treeText(p.id))}</div>` : ''}`;
    }

    function renderSchedule() {
      document.title = 'Season Schedule';
      const Sch = window.ProcSchedule;
      const r = Sch.run('plan.season', reg, C, L);
      const fmt = (d) => d === null ? '<strong>not done</strong>' : `${r.dateOf(d)} (day ${d})`;
      const milestones = ['plan.first-days', 'shelter.frame', 'fish.build-weir', 'snare.set-line', 'shelter.walls', 'plan.stove-stage-one', 'stove.first-firing', 'plan.stove-stage-two', 'shelter.earth-skirt', 'shelter.snow-bank', 'fish.ice-net']
        .filter((id) => reg.get(id)).map((id) => {
          const due = r.jobs.filter((j) => j.id === id || j.parents.includes(id)).reduce((t, j) => Math.min(t, j.window.to), Infinity);
          return `<tr><td>${link(id)}</td><td>${fmt(r.finish(id))}</td><td>${due === Infinity ? '–' : `${r.dateOf(due)} (day ${due})`}</td></tr>`;
        }).join('');
      const weeks = [];
      for (let i = 0; i < r.days.length; i += 7) {
        const w = r.days.slice(i, i + 7);
        const sum = (f) => w.reduce((t, d) => t + f(d), 0);
        const jobs = new Map();
        w.forEach((d) => d.did.forEach((x) => jobs.set(x.id, (jobs.get(x.id) || 0) + x.hours)));
        const top = [...jobs].sort((a, b) => b[1] - a[1]).slice(0, 3).map(([id]) => esc(reg.get(id).title)).join(', ');
        weeks.push(`<tr><td>${w[0].date}</td><td>${(sum((d) => d.daylight) / w.length).toFixed(1)}</td><td>${sum((d) => d.work).toFixed(0)}</td><td>${sum((d) => d.routineHours).toFixed(0)}</td><td>${sum((d) => d.buildHours).toFixed(0)}</td><td>${top || '–'}</td></tr>`);
      }
      app.innerHTML = `
        <p><a href="#">All instructions</a></p>
        <h1>Season schedule</h1>
        <p class="sub">The season plan run day by day: daylight at 62.5° N, daily routines first, then each building job in order, starting only when its tools and materials exist and any drying wait has passed. Hours are the instructions' own estimates, so this is a rough guide, not a promise.</p>
        <div class="grid">
          <div class="box"><h3>Building needed</h3><p><strong>${r.needed.toFixed(0)} h</strong></p></div>
          <div class="box"><h3>Building done by ${r.dateOf(r.days.length - 1)}</h3><p><strong>${r.built.toFixed(0)} h</strong></p></div>
          <div class="box"><h3>Routines over the daylight</h3><p><strong>${r.routineOverrun.toFixed(0)} h</strong></p></div>
        </div>
        ${r.unfinished.length ? `<p class="err">The plan does not fit: ${r.unfinished.length} jobs, about ${(r.needed - r.built).toFixed(0)} hours of building, are still undone at the end, and ${r.late.length} jobs finish after their phase ends. The daily routines alone take more than the working day on many days.</p>` : ''}
        <h2>Milestones</h2>
        <div class="box" style="overflow-x:auto"><table style="width:100%;border-collapse:collapse"><tr><th align="left">Job</th><th align="left">Finished</th><th align="left">Due</th></tr>${milestones}</table></div>
        <h2>Week by week</h2>
        <div class="box" style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums"><tr><th align="left">Week of</th><th align="left">Daylight h</th><th align="left">Work h</th><th align="left">Routines h</th><th align="left">Building h</th><th align="left">Main jobs</th></tr>${weeks.join('')}</table></div>`;
    }

    function route() {
      const id = decodeURIComponent(location.hash.slice(1));
      const p = id && reg.get(id);
      if (id === 'schedule') renderSchedule(); else if (p) renderOne(p); else renderList();
      window.scrollTo(0, 0);
    }
    window.addEventListener('hashchange', route);
    route();
  }).catch((e) => {
    app.innerHTML = `<div class="err">The instructions did not load: ${esc(e.message)}</div>`;
  });
})();
</script>
</body>
</html>
